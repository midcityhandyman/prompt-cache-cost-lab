[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prompt-cache-cost-lab"
version = "0.1.0"
description = "Cost lab for one LLM workload: no caching vs prompt caching vs batch vs a cheaper model tier."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]
live = ["anthropic"]

[project.scripts]
costlab = "costlab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
